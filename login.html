<!DOCTYPE html>

<title>Login - PageTurn Book Store</title>

<header class="topbar">
    <img src="college-logo.jpg" alt="College Logo" class="logo">
    <h1 class="brand">PageTurn Book Store</h1>
</header>

<div class="navbar">
    <a href="home.html">Home</a>
    <a href="login.html">Login</a>
    <a href="register.html">Registration</a>

<div class="page">
    <main class="main-content">
        <div class="login-card">
            <h2>Member Login</h2>
            <form>
                <label for="uname">User Name</label>
                <input type="text" id="uname" name="username" placeholder="Enter your username">

                <label for="pwd">Password</label>
                <input type="password" id="pwd" name="password" placeholder="Enter your password">

                <div class="btn-row">
                    <button type="submit">Submit</button>
                    <button type="reset">Reset</button>
                </div>
            </form>
        </div>
    </main>

    <aside class="branch-panel">
        <h3>Branches</h3>
        <div class="branch">CSE</div>
        <div class="branch">ECE</div>
        <div class="branch">EEE</div>
        <div class="branch">CIVIL</div>
    </aside>
</div>
