    <img src="college-logo.jpg" alt="GL Bajaj Logo" class="logo">
    <h1>PageTurn Book Store</h1>

    <a href="home.html">Home</a>

<h2 class="heading">Registration Form</h2>

<form class="register-form">
    <label>Name:</label><br>
    <input type="text" name="name"><br><br>

    <label>Password:</label><br>
    <input type="password" name="password"><br><br>

    <label>E-mail ID:</label><br>
    <input type="text" name="email"><br><br>

    <label>Phone Number:</label><br>
    <input type="text" name="phone"><br><br>

    <label>Sex:</label><br>
    <input type="radio" name="sex"> Male
    <input type="radio" name="sex"> Female <br><br>

    <label>Date of Birth:</label><br>
    <select name="day">
        <option>01</option><option>02</option><option>03</option>
        <option>04</option><option>05</option>
    </select>
    <select name="month">
        <option>Jan</option><option>Feb</option><option>Mar</option>
        <option>Apr</option><option>May</option>
    </select>
    <select name="year">
        <option>2005</option><option>2006</option><option>2007</option>
        <option>2008</option>
    </select><br><br>

    <label>Languages Known:</label><br>
    <input type="checkbox"> English
    <input type="checkbox"> Telugu
    <input type="checkbox"> Hindi
    <input type="checkbox"> Tamil <br><br>

    <label>Address:</label><br>
    <textarea rows="4" cols="30"></textarea><br><br>

    <button type="submit">Submit</button>
    <button type="reset">Reset</button>
</form>

<div class="footer">

</div>
