<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GL Bajaj Book Store</title>
<link rel="stylesheet" href="registration.css">
</head>
<body>
    <header class="site-header">
    <img src="college-logo.jpg" alt="GL Bajaj Logo" class="logo">
    <h1>GL BAJAJ BOOK STORE</h1>
  </header>

  
  <nav class="navbar">
    <a href="index.html">Home</a>
    <a href="login.html">Login</a>
    <a href="registration.html">Registration</a>
    <a href="catalogue.html">Catalogue</a>
    <a href="cart.html">Cart</a>
  </nav>


    <section id="registration" class="page-section">
    <div class="page-wrapper">
      <main class="center-form">
        <div class="form-box">
          <h2>Registration Form</h2>

          <label for="name">Name:</label>
          <input type="text" id="name">

          <label for="pass">Password:</label>
          <input type="password" id="pass">

          <label for="email">E-mail ID:</label>
          <input type="email" id="email">

          <label for="phone">Phone Number:</label>
          <input type="text" id="phone">

          <label>Sex:</label>
          <div class="inline-options">
            <input type="radio" name="sex" id="male"> <label for="male">Male</label>
            <input type="radio" name="sex" id="female"> <label for="female">Female</label>
          </div>

          <label>Date of Birth:</label>
          <div class="inline-options">
            <select><option>01</option><option>02</option><option>03</option></select>
            <select><option>Jan</option><option>Feb</option><option>Mar</option></select>
            <select><option>2005</option><option>2004</option><option>2003</option></select>
          </div>

          <label>Languages Known:</label>
          <div class="inline-options">
            <input type="checkbox" id="eng"> <label for="eng">English</label>
            <input type="checkbox" id="tel"> <label for="tel">Telugu</label>
            <input type="checkbox" id="hin"> <label for="hin">Hindi</label>
            <input type="checkbox" id="tam"> <label for="tam">Tamil</label>
          </div>

          <label for="address">Address:</label>
          <textarea id="address" rows="3"></textarea>

          <div class="btn-row">
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
          </div>
        </div>
      </main>
      <aside class="branches">
        <h3>Branches</h3>
        <a href="#catalogue" class="branch-link">CSE</a>
<a href="#catalogue" class="branch-link">ECE</a>
<a href="#catalogue" class="branch-link">EEE</a>
<a href="#catalogue" class="branch-link">CIVIL</a>
      </aside>
    </div>
    <footer class="site-footer">
      <p>Rudransh Rai</p>
      <p>Roll No - 2501920110317</p>
    </footer>
  </section>
</body>
</html>
